<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>OmenWatch</title>
  <!-- A watched circle and one bird crossing its edge: Roman augurs read omens
       from birds crossing a marked piece of sky. One flat color, no effects. -->
  <style>.mark{color:#0F766E} @media (prefers-color-scheme: dark){.mark{color:#4FD8C4}}</style>
  <g class="mark"><mask id="omenwatch-gap"><rect width="32" height="32" fill="#fff"/><path d="M-6 -0.6C-4 -2.2 -1.6 -1.6 0 0.6C1.6 -1.6 4 -2.2 6 -0.6C3.6 -0.9 1.6 0.4 0 2.6C-1.6 0.4 -3.6 -0.9 -6 -0.6Z" transform="translate(23 9) rotate(-18) scale(1.08)" fill="#000" stroke="#000" stroke-width="3.2" stroke-linejoin="round"/></mask><circle cx="16" cy="16" r="12" stroke="currentColor" stroke-width="2.5" mask="url(#omenwatch-gap)"/><path d="M-6 -0.6C-4 -2.2 -1.6 -1.6 0 0.6C1.6 -1.6 4 -2.2 6 -0.6C3.6 -0.9 1.6 0.4 0 2.6C-1.6 0.4 -3.6 -0.9 -6 -0.6Z" transform="translate(23 9) rotate(-18) scale(1.08)" fill="currentColor"/></g>
</svg>
